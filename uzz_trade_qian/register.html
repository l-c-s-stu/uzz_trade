<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <style>
        body {
            font-family: "微软雅黑";
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        form {
            max-width: 310px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>用户注册</h2>
    <form id="registerForm">
        <input type="text" id="username" placeholder="用户名" required><br>
        <input type="email" id="email" placeholder="邮箱" required><br>
        <input type="tel" id="phone" placeholder="手机号" required><br>
        <input type="password" id="password" placeholder="密码" required><br>
        <input type="password" id="confirmPassword" placeholder="确认密码" required><br>
        <button type="submit">注册</button>
    </form>

    <p>已有账号？<a href="login.html">去登录</a></p>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
